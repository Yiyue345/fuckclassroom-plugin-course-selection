[package]
name = "fuckclassroom-hy2"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[lib]
name = "fuckclassroom_hy2"
path = "src/lib.rs"

[[bin]]
name = "hy2_serve"
path = "src/main.rs"

[dependencies]
aes = "0.8.4"
anyhow = "1"
cbc = { version = "0.1.2", default-features = false, features = ["std", "alloc"] }
cipher = { version = "0.4", features = ["block-padding"] }
rand = "0.9.0"
rsteria2 = "0.1.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "s"
lto = false
codegen-units = 8
strip = true
