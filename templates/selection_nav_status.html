{% set selection_session_status = request.app.state.get_selection_session_status() %}
<span class="nav-label-status" title="{% if selection_session_status.is_valid is sameas true %}会话有效{% elif selection_session_status.is_saved %}会话待验证{% else %}未登录{% endif %}">
  <span class="session-dot{% if selection_session_status.is_saved and selection_session_status.is_valid is not sameas false %} valid{% else %} invalid{% endif %}" data-session-indicator="selection"></span>
</span>
